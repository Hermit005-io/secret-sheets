[project]
name = "secretsheets"
version = "0.1.0"
description = "Split a secret into printed sheets for people you trust."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.5"]

[project.scripts]
secretsheets = "secretsheets.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tools/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
