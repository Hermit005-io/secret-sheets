name: tests

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install cryptography pytest hypothesis ruff
      - run: ruff check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: docs/index.html is exactly what the source builds
        run: git diff --exit-code -- ../docs/index.html
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  cross-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install cryptography
      - run: npm ci
        working-directory: tools
      - run: npm ci
        working-directory: web
      - name: Python maths against the audited library
        run: python tools/cross_check.py 5000
      - name: Sheets between the Python and web versions
        run: python tools/cross_versions.py 500
      - name: Mangled sheets read the same way by both versions
        run: python tools/cross_reading.py 50000
