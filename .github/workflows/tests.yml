name: tests

on: [push, pull_request]

# A newer push replaces a run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install cryptography pytest hypothesis ruff
      - run: ruff check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: docs/index.html is exactly what the source builds
        run: git diff --exit-code -- ../docs/index.html
      # The browser only. GitHub's machines already have the system libraries
      # it needs, and installing them again has been known to stall.
      - run: npx playwright install chromium
      - run: npm run e2e

  cross-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install cryptography
      - run: npm ci
        working-directory: tools
      - run: npm ci
        working-directory: web
      - name: Python maths against the audited library
        run: python tools/cross_check.py 5000
      - name: Sheets between the Python and web versions
        run: python tools/cross_versions.py 500
      - name: Mangled sheets read the same way by both versions
        run: python tools/cross_reading.py 50000
